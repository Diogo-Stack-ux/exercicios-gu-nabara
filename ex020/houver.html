<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de houver</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: rgb(240, 240, 240);
        }
        div:hover {
            background-color: rgb(56, 13, 137);
            color: white;
            font-size: 30px;
            border-radius: 10px;
            transition: all 0.5s;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>exemplo de houver</h1>
    <p>passe o mouse sobre o texto abaixo</p>
    <div>passe o mouse aqui</div>
</body>
</html>
