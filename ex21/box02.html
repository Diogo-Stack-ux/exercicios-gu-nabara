<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixas</title>
    <style>
        h1 {
           background-color: aqua;
           height: 300px;
           width:300px;
          border: 10px solid black ;
              padding: 20px ;

             margin: 20px auto 40px auto;

            outline: 5px dashed red;
        }

    a {
            border-width: 10px;
           border-style: solid;
           border-color: black;

           padding-top: 20px;
            padding-left: 20px;
            padding-bottom: 20px;
            padding-right: 20px;

        }
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>paragrafos tamém são exemplos de box-level, mas os <a href="#">Links são exemplos de caixas inline-level</a>Vamos ver como tudo funciona.</p>
</body>
</html>
